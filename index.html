<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今週の声かけ デイサービス版</title>
<style>
:root{
  --cyan:#00BCD4; --cyan-d:#0097A7; --cyan-l:#E0F7FA;
  --orange:#F29600; --orange-l:#FFF3E0;
  --dark:#333; --mid:#666; --light:#F0F0F0; --border:#DDD; --white:#fff;
  --red:#CC0000; --red-l:#FDECEC; --green:#1E8A4C; --green-l:#E7F5EC;
  --base:#1E3A6E;
}
*{box-sizing:border-box}
body{margin:0;background:#F7F8FA;color:var(--dark);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:14px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
.demo-bar{background:var(--orange);color:#fff;text-align:center;font-size:12px;padding:4px 16px}
header{background:var(--white);border-bottom:3px solid var(--cyan);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:18px}
header .brand small{display:block;font-weight:400;font-size:11px;color:var(--mid)}
.mode{margin-left:auto;display:flex;border:1px solid var(--cyan);border-radius:20px;overflow:hidden}
.mode button{border:0;background:#fff;color:var(--cyan-d);padding:6px 16px;font-size:13px}
.mode button.on{background:var(--cyan);color:#fff;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 90px)}
nav{width:220px;background:var(--white);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
nav .grp{font-size:11px;color:var(--mid);padding:12px 20px 4px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 20px;font-size:14px;color:var(--dark);border-left:4px solid transparent}
nav button.on{background:var(--cyan-l);border-left-color:var(--cyan);font-weight:700}
nav button[hidden]{display:none}
main{flex:1;padding:24px 32px;max-width:1100px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--mid);margin:0 0 20px}
.card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card.accent{border-top:4px solid var(--orange)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>.card{flex:1;min-width:260px}
.pill{display:inline-block;font-size:11px;padding:1px 10px;border-radius:10px;background:var(--light);color:var(--mid);margin-right:4px}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.orange{background:var(--orange-l);color:#B36B00}
.pill.cyan{background:var(--cyan-l);color:var(--cyan-d)}
.pill.green{background:var(--green-l);color:var(--green)}
.target{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;cursor:pointer}
.rank{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.rank.r2{background:#F5B042}.rank.r3{background:#F7C97A}
.target h3{margin:0;font-size:17px}
.target .why{color:var(--mid);font-size:13px;margin-top:2px}
.risk{text-align:right;font-size:12px;color:var(--mid)}
.risk b{display:block;font-size:22px;color:var(--red)}
.detail{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px;display:none}
.card.open .detail{display:block}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.src>div{background:var(--light);border-radius:6px;padding:10px 12px;font-size:13px}
.src h4{margin:0 0 6px;font-size:12px;color:var(--cyan-d)}
mark{background:#FFE7B8;padding:0 2px}
.quote{font-size:12.5px;border-left:3px solid var(--border);padding-left:8px;margin:4px 0;color:#444}
.script{background:var(--cyan-l);border-radius:6px;padding:12px 16px}
.script h4{margin:0 0 6px;font-size:14px}
.script ol{margin:4px 0 8px;padding-left:20px}
.script .ng{color:var(--red);font-size:13px}
.bars{display:grid;grid-template-columns:70px 1fr 28px;gap:4px 8px;align-items:center;font-size:12px}
.bar{height:8px;background:#E6E6E6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar i.hi{background:var(--orange)}
.btn{border:0;background:var(--orange);color:#fff;padding:8px 18px;border-radius:6px;font-size:14px;font-weight:700}
.btn.sub{background:#fff;color:var(--cyan-d);border:1px solid var(--cyan)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--light);font-weight:700;font-size:12px}
.score{font-weight:700;font-size:18px}
.score.good{color:var(--green)}.score.mid{color:#B36B00}.score.bad{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--border);background:#fff;padding:6px 14px;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--cyan);color:#fff}
label.f{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input[type=number],textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--border);border-radius:6px;padding:6px 10px}
textarea{width:100%;min-height:60px}
.phone{width:340px;border:10px solid #222;border-radius:32px;background:#fff;padding:18px 16px;margin:0 auto}
.phone h3{margin:0 0 4px;font-size:16px}
.phone .q{margin:14px 0 6px;font-size:13.5px;font-weight:700}
.phone .opts{display:flex;gap:6px}
.phone .opts button{flex:1;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 0;font-size:13px}
.phone .opts button.on{background:var(--cyan);border-color:var(--cyan);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi .card{margin:0}
.kpi .v{font-size:26px;font-weight:700;color:var(--orange)}
.kpi .l{font-size:12px;color:var(--mid)}
.kpi .c{font-size:12px}
.legend{font-size:12px;color:var(--mid)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 12px}
.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.guest h3{margin:0;font-size:17px}
.guest .do{background:var(--green-l);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:13px}
.guest .dont{background:var(--red-l);border-radius:6px;padding:8px 12px;margin-top:8px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--mid)}
@media (max-width:820px){
  .layout{flex-direction:column}
  nav{width:100%;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--border)}
  nav .grp{display:none}
  nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}
  nav button.on{border-bottom-color:var(--cyan)}
  main{padding:16px}
  .src,.kpi,.cardgrid{grid-template-columns:1fr}
  .phone{width:100%}
}

/* ---------- パスワード入力画面（閲覧ゲート） ---------- */
body.locked > :not(#gate){visibility:hidden}
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#F7F8FA 0%,#E0F7FA 100%);display:flex;align-items:center;justify-content:center;padding:24px}
#gate[hidden]{display:none}
.gate-box{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);padding:40px 36px 32px;width:100%;max-width:420px;text-align:center;border-top:5px solid var(--cyan)}
.gate-lock{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--cyan-l);display:flex;align-items:center;justify-content:center}
.gate-lock svg{width:32px;height:32px;stroke:var(--cyan-d);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gate-box h2{margin:0;font-size:20px}
.gate-box .sub{color:var(--mid);font-size:13px;margin:6px 0 22px}
.gate-box .sub small{display:block;margin-top:2px}
.gate-field{position:relative}
.gate-field input{width:100%;font-family:inherit;font-size:18px;letter-spacing:.1em;padding:12px 48px 12px 14px;border:2px solid var(--border);border-radius:8px;outline:none;transition:border-color .15s}
.gate-field input:focus{border-color:var(--cyan)}
.gate-field.err input{border-color:var(--red);animation:shake .3s}
.gate-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mid);font-size:12px;padding:6px}
.gate-msg{min-height:20px;font-size:13px;color:var(--red);margin:8px 0 4px}
.gate-btn{width:100%;margin-top:8px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;padding:13px}
.gate-btn:disabled{opacity:.5;cursor:default}
.gate-foot{margin-top:22px;font-size:11.5px;color:var(--mid);line-height:1.6}
.gate-foot b{color:var(--dark)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body class="locked">
<!-- ===== パスワード入力画面 ===== -->
<div id="gate">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <div class="gate-lock"><svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2"/></svg></div>
    <h2>今週の声かけ デイサービス版</h2>
    <p class="sub">関係者限定のデモ画面です。<small>閲覧用パスワードを入力してください。</small></p>
    <div class="gate-field" id="gateField">
      <input type="password" id="gatePw" placeholder="パスワード" aria-label="閲覧用パスワード" autofocus>
      <button type="button" class="gate-eye" id="gateEye" aria-label="パスワードを表示">表示</button>
    </div>

    <button type="submit" class="gate-btn" id="gateBtn">開く</button>

  </form>
</div>

<div class="demo-bar">デモ用の架空データです。実在の施設・人物とは関係ありません（GENIAC-PRIZE 2026 実証用プロトタイプ）</div>
<header>
  <div class="brand">今週の声かけ<small>デイサービスの定着支援　性格分析 × 国産基盤モデル　｜　株式会社ロジック・ブレイン</small></div>
</header>
<div class="layout">
  <nav id="nav">
    <div class="grp" data-l="管理者向け"></div>
    <button data-v="week" class="on">今週の声かけ</button>

    <div class="grp">検証</div>
    <button data-v="verify">効果検証</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- 架空データ ----------
const B5 = ['開放性','誠実性','外向性','協調性','神経症傾向'];
const LV = {'面談':['red','面談する（15分）'],'ひと声':['orange','ひと声かける（5分）'],'見守り':['cyan','見守る']};
const DATA = {

       text:['「中村さん『<mark>もう体がもたんわ</mark>』と笑っていた」（手書きの申し送り 10/22・スキャン）','「午後の入浴、中村さん一人で<mark>3人回した</mark>」（介護記録 10/23）'],
       gap:'本人の入力（疲れ 2／余裕 4）と、施設長の観察・記録（疲れの兆し 3件）が食い違っています。協調性が高い人の「大丈夫」は、周りに迷惑をかけたくない気持ちから出ることが多く、そのまま受け取らないほうがよいサインです。',

       open:'「いつも入浴を引き受けてくれて助かってる。最近、体はどう？」と、感謝から入る。',
       qs:['この2週間で、いちばん体にこたえた日はいつ？','入浴や送迎で、誰かに代わってほしかった場面はあった？','来週、少し軽くするとしたら、どこから外したい？'],
       ng:'「無理しないでね」だけで終わらせない。具体的に何を減らすかまで一緒に決める。'},
      {name:'山田 美咲', role:'介護職・2年目', unit:'ひまわり事業所', level:'ひと声', risk:56, trend:[42,45,50,56], mins:5,
       why:'本人のチェックで「疲れ 4」「困りごと：人間関係」。施設長の観察では普段どおり明るい。外向性が高く、表では明るく振る舞うタイプ。',
       b5:[4,3,5,3,4],
       self:{tired:4, room:2, worry:'人間関係', talk:'はい', note:'ちょっと相談したいことがあります'},
       obs:['いつもどおり明るい','特に変わった様子なし'],
       text:['「レクの進め方で<mark>意見がぶつかった</mark>」（申し送り 10/21）'],
       gap:'本人は困りごとを書いていますが、施設長からは見えていません。外向性が高い人は、つらいときも表情に出にくいことがあります。本人が「話したい」と答えているので、待たずに声をかけましょう。',
       when:'今週中に、本人が落ち着いている午前の送迎準備の時間に。',
       open:'「チェックに書いてくれてありがとう。少し話そうか」と、書いてくれたこと自体を受け止める。',
       qs:['いま困っているのは、どんな場面のこと？','誰かに間に入ってほしい？ それとも、まず聞いてほしい？'],
       ng:'相手の名前が出ても、その場でどちらが正しいかを決めない。'},
      {name:'高橋 陽子', role:'介護福祉士・8年目', unit:'すみれ事業所', level:'見守り', risk:38, trend:[36,37,37,38], mins:0,
       why:'本人のチェックは安定。施設長の観察で、同僚への言い方がきつい場面が2回。協調性が低めで、本人は気にしていないことが多い。',

       self:{tired:3, room:3, worry:'仕事の量', talk:'今はいい', note:'引き継ぎの時間が足りない'},

    staff:['中村 健太','山田 美咲','高橋 陽子','佐藤 由美','小林 誠','伊藤 大輝'],
    guests:[
      {name:'A様（88歳・要介護3）', tipi:'協調性 高／神経症傾向 高', src:'ケアプラン＋TIPI-J（ご家族記入）＋通所介護記録', plan:'自宅では入浴できず、入浴への拒否が強い。本人は「人に急かされるのが嫌」と話す（ケアプラン第2表より）', do:'入浴前に「今日は何番目がいいですか」と順番を選んでもらう。同じ職員が続けて担当すると落ち着く。', dont:'急かす声かけ。「早くしましょう」で入浴拒否が出やすい（記録で過去4件）。'},

};

// 検証ダッシュボード（8週・介入群 vs 対照群）
const VERIFY = {
  weeks:['W1','W2','W3','W4','W5','W6','W7','W8'],
  load:{t:'施設長の負担（観察入力＋声かけ、分/週）', a:[34,28,24,22,20,19,19,18], b:null},
  quit:{t:'退職意向スコア（全職員平均・5段階、高いほど辞めたい）', a:[2.6,2.6,2.5,2.4,2.3,2.2,2.2,2.1], b:[2.6,2.7,2.6,2.7,2.7,2.6,2.7,2.7]},
  hit:{t:'声かけの当たり率（%）', a:[52,60,66,70,72,75,77,79], b:null}
};
const KPI = [
  {l:'施設長が変化に気づくまでの日数', a:'平均 6日', b:'平均 23日', c:'17日早い'},
  {l:'職員のセルフチェック入力率', a:'87%', b:'—', c:'週1回・2分'},
  {l:'高ストレス者の比率', a:'18% → 12%', b:'19% → 20%', c:'6ポイント改善'}
];

// ---------- 状態と描画 ----------
const mode='care';
let view='week', openIdx=0;
const results={};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function D(){return DATA[mode]}

function bars(v){return '<div class="bars">'+B5.map((k,i)=>`<span>${k}</span><div class="bar"><i class="${v[i]>=4?'hi':''}" style="width:${v[i]/5*100}%"></i></div><span>${v[i]}</span>`).join('')+'</div>'}
function spark(arr){
  const w=90,h=28,mx=100;const pts=arr.map((v,i)=>`${i*(w/(arr.length-1))},${h-v/mx*h}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h+2}"><polyline points="${pts}" fill="none" stroke="#CC0000" stroke-width="2"/></svg>`;
}
function lvPill(l){return `<span class="pill ${LV[l][0]}">${LV[l][1]}</span>`}

const VIEWS={
week(){

function chart(s){
  const W=300,H=150,P=28;const all=[...s.a,...(s.b||[])];const mx=Math.max(...all)*1.1,mn=Math.min(0,Math.min(...all));
  const x=i=>P+i*(W-P-8)/(s.a.length-1), y=v=>H-P-(v-mn)/(mx-mn)*(H-P-10);
  const line=(arr,c)=>`<polyline points="${arr.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>`+arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${c}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">
  <line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="#DDD"/>
  ${VERIFY.weeks.map((w,i)=>`<text x="${x(i)}" y="${H-10}" font-size="10" fill="#666" text-anchor="middle">${w}</text>`).join('')}
  ${s.b?line(s.b,'#999'):''}${line(s.a,'#F29600')}
  <text x="${x(7)}" y="${y(s.a[7])-8}" font-size="11" fill="#F29600" text-anchor="end" font-weight="700">${s.a[7]}</text>
  ${s.b?`<text x="${x(7)}" y="${y(s.b[7])-8}" font-size="11" fill="#666" text-anchor="end">${s.b[7]}</text>`:''}
  </svg>`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelector('nav .grp').textContent=D().mgr+'向け';
  $('#main').innerHTML=VIEWS[view]();
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-toggle]'); if(!b) return;
  if(b.dataset.v){view=b.dataset.v;render();return}
  if(b.dataset.toggle!==undefined){const i=+b.dataset.toggle;openIdx=openIdx===i?-1:i;render();return}
  if(b.dataset.go){view=b.dataset.go;render();return}
  const seg=b.closest('.seg');
  if(seg){const key=mode+seg.dataset.i;results[key]=results[key]||{};results[key][seg.dataset.k]=b.textContent;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return}
  const opts=b.closest('.opts');
  if(opts){opts.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return}
  if(b.dataset.save!==undefined){
    const i=b.dataset.save,key=mode+i;results[key]=results[key]||{};
    document.querySelectorAll(`[data-i="${i}"][data-k]`).forEach(el=>{if(el.tagName!=='DIV')results[key][el.dataset.k]=el.value});
    results[key].saved=true;toast('保存しました（デモのため画面を閉じると消えます）');render();return}
  if(b.dataset.send!==undefined){toast('送信しました（デモ）');return}
});
render();

<script>
// ===== パスワードゲート =====
// 平文のパスワードはこのファイルに置かず、SHA-256 のハッシュだけを持つ。
// 変更方法：ブラウザの開発者ツール（Console）で  await gateHash('新しいパスワード')  を実行し、
//           表示された64桁の文字列を下の GATE_HASH に貼り替える。
// 注意：クライアント側のみの簡易ゲートです。HTMLソースを読める人には中身が見えるため、
//       本番公開時はサーバー側認証（Basic認証・組織認証）に置き換えてください。
const GATE_HASH = '8315123b03096d66ace057b7000bffdcd273f931ccc1952a41277186cbc0b0c8';   // 初期パスワード: geniac2026
const GATE_KEY  = 'geniac_demo_unlocked';

async function gateHash(str){
  const data = new TextEncoder().encode(str);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return sha256Fallback(data);
}
// crypto.subtle が使えない環境（古いブラウザ等）向けの純JS実装
function sha256Fallback(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length, bl=l*8, pad=((l+9+63)>>6)<<6, m=new Uint8Array(pad); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(pad-4,bl>>>0); dv.setUint32(pad-8,Math.floor(bl/2**32));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n)), w=new Uint32Array(64);
  for(let i=0;i<pad;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3),s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}

(function(){
  const gate=document.getElementById('gate'), form=document.getElementById('gateForm'),
        pw=document.getElementById('gatePw'), msg=document.getElementById('gateMsg'),
        field=document.getElementById('gateField'), btn=document.getElementById('gateBtn'),
        eye=document.getElementById('gateEye');
  let fails=0;
  function unlock(){ gate.hidden=true; document.body.classList.remove('locked'); try{sessionStorage.setItem(GATE_KEY,'1')}catch(e){} }
  document.body.classList.add('locked');
  try{ if(sessionStorage.getItem(GATE_KEY)==='1'){ unlock(); return; } }catch(e){}
  setTimeout(()=>pw.focus(),50);
  eye.addEventListener('click',()=>{ const show=pw.type==='password'; pw.type=show?'text':'password'; eye.textContent=show?'隠す':'表示'; pw.focus(); });
  pw.addEventListener('input',()=>{ field.classList.remove('err'); msg.textContent=''; });
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const v=pw.value.trim();
    if(!v){ msg.textContent='パスワードを入力してください。'; field.classList.add('err'); return; }
    btn.disabled=true; btn.textContent='確認中…';
    const ok=(await gateHash(v))===GATE_HASH;
    btn.disabled=false; btn.textContent='開く';
    if(ok){ unlock(); return; }
    fails++; pw.value=''; field.classList.add('err');
    msg.textContent = fails>=3 ? 'パスワードが違います。担当者（ロジック・ブレイン）にご確認ください。' : 'パスワードが違います。';
    pw.focus();
  });
})();
</script>
</body>
</html>
